name: Auto Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Tạo cấu trúc Android tiêu chuẩn
        run: |
          flutter create --platforms=android .
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

      - name: Cài đặt thư viện
        run: flutter pub get

      - name: Biên dịch file APK
        run: flutter build apk --release

      - name: Lưu trữ file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: CCCD-Scanner-App
          path: build/app/outputs/flutter-apk/app-release.apk
